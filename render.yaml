# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: yatrabuddy-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: SECURE_COOKIES
        value: "1"
      - key: REQUIRE_GOOGLE_SIGN_IN
        value: "1"
      - key: PUBLIC_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_FALLBACK
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
