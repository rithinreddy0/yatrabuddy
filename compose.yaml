services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        ENABLE_CRAWL4AI: ${ENABLE_CRAWL4AI:-0}
    environment:
      DATABASE_URL: postgresql+psycopg://wayfarer:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/wayfarer
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      REQUIRE_GOOGLE_SIGN_IN: ${REQUIRE_GOOGLE_SIGN_IN:-1}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      ENABLE_WEATHER: ${ENABLE_WEATHER:-1}
      ENABLE_CRAWL4AI: ${ENABLE_CRAWL4AI:-0}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
      BOOKING_API_TOKEN: ${BOOKING_API_TOKEN:-}
      BOOKING_AFFILIATE_ID: ${BOOKING_AFFILIATE_ID:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      ENABLE_GOOGLE_PLACE_PHOTOS: ${ENABLE_GOOGLE_PLACE_PHOTOS:-0}
      AI_CHAT_COMPLETIONS_URL: ${AI_CHAT_COMPLETIONS_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      TRAVEL_CHAT_PROVIDER: ${TRAVEL_CHAT_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_FALLBACK: ${GROQ_API_KEY_FALLBACK:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      VOICE_TRANSCRIPTION_URL: ${VOICE_TRANSCRIPTION_URL:-}
      VOICE_TRANSCRIPTION_MODEL: ${VOICE_TRANSCRIPTION_MODEL:-}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wayfarer
      POSTGRES_USER: wayfarer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wayfarer"]
      interval: 4s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
